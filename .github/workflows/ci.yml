name: CI

on:
  # Executa em todo push e em toda pull request, independentemente da branch.
  push:
  pull_request:

# O workflow apenas lê o repositório. Não há publicação nem acesso a segredos aqui.
permissions:
  contents: read

jobs:
  backend:
    name: Backend - build e testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore StudyFlow.Api.Tests/StudyFlow.Api.Tests.csproj

      - name: Compilar em modo Release
        run: dotnet build StudyFlow.Api/StudyFlow.Api.csproj --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test StudyFlow.Api.Tests/StudyFlow.Api.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar frontend
        run: npm run build
